
[project]
authors = [
    {name = "Nicholas Gates", email = "nick@fulcrum.so"},
]
license = {text = "Apache 2.0"}
requires-python = "<4.0,>=3.11"
dependencies = [
    "ziglang<1.0.0,>=0.14.0",
    "pydantic<3.0.0,>=2.3.0",
    "setuptools<81.0.0,>=80.0.0",
    "black<26.0.0,>=25.0.0",
]
name = "ziggy-pydust"
version = "0.1.0"
description = ""
readme = "README.md"

[project.entry-points.pytest11]
pydust = "pydust.pytest_plugin"

[project.scripts]
pydust = "pydust.__main__:main"

[dependency-groups]
dev = [
    "pytest<9.0.0,>=8.0.0",
    "ruff<1.0.0,>=0.12.0",
]
docs = [
    "ziglang<1.0.0,>=0.14.0",
    "mkdocs-material<10.0.0,>=9.2.6",
    "mkdocs-include-markdown-plugin<8.0.0,>=7.1.5",
    "mike<3.0.0,>=2.0.0",
]
test = [
    "numpy<3.0.0,>=2.0.0",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["F", "E", "W", "UP", "I"]
# Do not auto-fix unused variables. This is really annoying when IntelliJ runs autofix while editing.
unfixable = ["F841"]

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"

[tool.pdm.build]
includes = ["pydust", "pydust/src"]
excludes = ["example"]

[tool.pytest.ini_options]
testpaths = ["test", "example"]

# Out test modules

[tool.pydust]
root = "example/"
build_zig = "pytest.build.zig"

[[tool.pydust.ext_module]]
name = "example.args_types"
root = "example/args_types.zig"

[[tool.pydust.ext_module]]
name = "example.exceptions"
root = "example/exceptions.zig"

[[tool.pydust.ext_module]]
name = "example.hello"
root = "example/hello.zig"

[[tool.pydust.ext_module]]
name = "example.gil"
root = "example/gil.zig"

[[tool.pydust.ext_module]]
name = "example.memory"
root = "example/memory.zig"

[[tool.pydust.ext_module]]
name = "example.modules"
root = "example/modules.zig"

[[tool.pydust.ext_module]]
name = "example.pytest"
root = "example/pytest.zig"

[[tool.pydust.ext_module]]
name = "example.result_types"
root = "example/result_types.zig"

[[tool.pydust.ext_module]]
name = "example.functions"
root = "example/functions.zig"

[[tool.pydust.ext_module]]
name = "example.classes"
root = "example/classes.zig"

[[tool.pydust.ext_module]]
name = "example.buffers"
root = "example/buffers.zig"

[[tool.pydust.ext_module]]
name = "example.iterators"
root = "example/iterators.zig"

[[tool.pydust.ext_module]]
name = "example.operators"
root = "example/operators.zig"

[[tool.pydust.ext_module]]
name = "example.code"
root = "example/code.zig"
